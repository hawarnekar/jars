[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jars-lib"
version = "0.1.0"
description = "JEE (JoSAA) admission recommendation system — reusable library + TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshad Warnekar" }]
keywords = ["jee", "josaa", "nirf", "admissions", "recommendation", "tui"]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
scrape = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.5"]
all = [
    "textual>=0.60",
    "playwright>=1.40",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[project.scripts]
jars-lib = "jars_lib.cli:main"
jars = "jars_tui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jars_lib", "tui/jars_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tui"]

[tool.ruff]
line-length = 100
target-version = "py310"
