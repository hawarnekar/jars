name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: jars-cli (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jars-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Guard against publishing a stale web dataset: if jars-cli/data was refreshed without
  # re-running `npm run gen:data`, the regenerated dataset/golden files differ from the
  # committed ones and this job fails. The exporter is deterministic for a given store
  # (generated_at derives from the store's last_updated stamp), so a clean diff means
  # the committed web data matches the parquet store exactly.
  data-sync:
    name: web dataset in sync with jars-cli data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ./jars-cli
      - run: python jars-cli/tools/build_web_data.py
      - run: git diff --exit-code -- jars-web/public/data jars-web/tests/golden

  web:
    name: jars-web (typecheck, parity, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jars-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jars-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The vitest suite includes the golden parity tests that assert the TS engine
      # reproduces jars_lib's output against the committed dataset.
      - run: npm test
      - run: npm run build
