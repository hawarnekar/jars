name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: jars-cli (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jars-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    name: jars-web (typecheck, parity, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jars-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jars-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The vitest suite includes the golden parity tests that assert the TS engine
      # reproduces jars_lib's output against the committed dataset.
      - run: npm test
      - run: npm run build
